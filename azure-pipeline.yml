trigger:
  branches:
    include:
      - main  # The branch you want to deploy from

pool:
  name: 'agentpool'  # Your self-hosted agent pool

jobs:
  - job: BuildAndDeploy
    displayName: 'Build and Deploy React-Django App'
    steps:
      - checkout: self  # Checkout the repository

      # Install Node.js for React app build
      - task: NodeTool@0
        inputs:
          versionSpec: '14.x'
          addToPath: true

      # Install React dependencies and build the app
      - script: |
          cd frontend
          npm install
          npm run build
        displayName: 'Build React App'

      # Install Python and create a virtual environment for Django
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.x'
          addToPath: true

      # Install Django dependencies
      - script: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
        displayName: 'Install Django Dependencies'

      # Run Django tests (optional)
      - script: |
          cd backend
          source venv/bin/activate
          python manage.py test
        displayName: 'Run Django Tests'

      # Collect static files for Django (for production)
      - script: |
          cd backend
          source venv/bin/activate
          python manage.py collectstatic --noinput
        displayName: 'Collect Static Files for Django'

  - job: Deploy
    displayName: 'Deploy to Server'
    steps:
      - task: SSH@0
        inputs:
          sshEndpoint: 'your-ssh-service-connection'  # The service connection you've set up for SSH to your server
          runOptions: 'inline'
          inline: |
            # Pull latest changes for both React and Django
            cd /path/to/your/app
            git pull origin main

            # Deploy React Build (frontend)
            cd /path/to/your/app/frontend
            npm install
            npm run build

            # Deploy Django (backend)
            cd /path/to/your/app/backend
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput

            # Copy the custom Nginx configuration file (automated)
            echo "Deploying Nginx configuration..."
            sudo cp /path/to/your/repository/nginx.conf /etc/nginx/sites-available/your_app

            # Enable the Nginx configuration by creating a symlink
            sudo ln -s /etc/nginx/sites-available/your_app /etc/nginx/sites-enabled/

            # Test Nginx configuration
            sudo nginx -t

            # Restart Nginx to apply the changes
            sudo systemctl restart nginx

            echo "Deployment completed successfully!"
